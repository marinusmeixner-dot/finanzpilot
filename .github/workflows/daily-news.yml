name: FinanzPilot – Quellen-Inbox und Schlusskurse
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-news.yml'
      - 'scripts/refresh_news.py'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *' # hourly source discovery; UTC, no editorial publication
    - cron: '25 6 * * *' # daily best-effort historical price refresh, UTC
concurrency:
  group: finanzpilot-source-discovery
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect unverified RSS candidates (never overwrite editorial)
        run: python scripts/refresh_news.py
      - name: Free historical daily close prices (not intraday)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '25 6 * * *'
        continue-on-error: true
        run: |
          python -m pip install --quiet yfinance
          python scripts/refresh_prices.py
      - name: Commit only inbox and price updates, retry cleanly against concurrent editorial commits
        run: |
          set -eu
          git config user.name "finanzpilot-source-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/editorial-candidates.json data/prices.json
          if git diff --cached --quiet; then
            echo "No new candidates or verified closing-price points."
            exit 0
          fi
          git commit -m "editorial: refresh unverified source inbox and daily prices"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Inbox/prices successfully published"
              exit 0
            fi
            git rebase --abort || true
            sleep "$((attempt*2))"
          done
          echo "::error::Failed to publish source inbox after 3 attempts"
          exit 1
