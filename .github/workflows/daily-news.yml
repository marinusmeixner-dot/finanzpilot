name: FinanzPilot – tägliche RSS-Nachrichten
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-news.yml'
      - 'scripts/refresh_prices.py'
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *' # 07:17 MEZ / 08:17 MESZ (GitHub-Uhr = UTC)
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Öffentliche Nachrichten aktualisieren
        run: python scripts/refresh_news.py
      - name: Freie Kursdaten aktualisieren (historische Tageskurse, kein Live-Tick)
        continue-on-error: true
        run: |
          python -m pip install --quiet yfinance
          python scripts/refresh_prices.py
      - name: Nur Änderungen veröffentlichen
        run: |
          git config user.name "finanzpilot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily.json data/prices.json
          if git diff --cached --quiet; then
            echo "Keine neuen Nachrichten."
          else
            git commit -m "FinanzPilot: tägliche Marktüberschriften"
            git push
          fi