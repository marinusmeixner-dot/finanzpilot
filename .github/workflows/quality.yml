name: FinanzPilot Quality Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  webapp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: find . -type f -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -r -n1 node --check
      - name: Validate hourly unverified source collector (no editorial overwrite)
        run: python -m unittest discover -s scripts -p 'test_refresh_news.py' -v
      - name: Validate JSON files
        run: node -e "const fs=require('fs');for(const x of fs.readdirSync('data')){if(x.endsWith('.json'))JSON.parse(fs.readFileSync('data/'+x,'utf8'))}"
      - name: "V77: Verify adaptive learning, 174 objectives, mixed question variants and private-sync merge"
        run: node scripts/test_adaptive_learning_v77.mjs
      - name: "V76: Test understandable explanations, 18 foundation guides and all 156 unchanged exams"
        run: node scripts/test_learning_explain_v76.mjs
      - name: "V75: Accept correct foundation XP and FP on the live server ledger"
        run: node scripts/test_foundation_reward_constraints_v75.mjs
      - name: "V74: Server-backed XP reconciliation for every graded lesson"
        run: node scripts/test_xp_reconciliation_v74.mjs
      - name: "V73: Explain relevant financial terms before quiz answers"
        run: node scripts/test_learning_terms_v73.mjs
      - name: "V68: Mobile browser-aligned one-row flex header without cropped Sync"
        run: node scripts/test_header_alignment_v65.mjs
      - name: "V64: Profile Streak section, total-only portfolio header and retained sync"
        run: node scripts/test_profile_streak_header_v64.mjs
      - name: "V63: Select, verify, then finish with earned rewards and responsive portfolio header"
        run: node scripts/test_answer_flow_v63.mjs
      - name: "V56: Economically sustainable XP/FP and balanced skill investment"
        run: node scripts/test_economy_v56.mjs
      - name: "V60: Display verified Alphabet and other private-watchlist articles after login"
        run: node scripts/test_watchlist_news_v60.mjs
      - name: "V61: Profile sound/motion switches, confirmed reward animations and depot wealth header"
        run: node scripts/test_reward_settings_depot_v61.mjs
      - name: "V61: Rewards, normal sounds, profile switches and true depot total"
        run: node scripts/test_rewards_profile_v61.mjs
      - name: "V59: Optional per-lesson abbreviation glossary without inline parentheses"
        run: node scripts/test_abbreviations_v59.mjs
      - name: "V58: Audible high correct/wrong feedback and guaranteed lesson completion animations"
        run: node scripts/test_lesson_audio_reward_v58.mjs
      - name: "V57: Balanced progression, idempotent EUR rewards, taught questions and correct back navigation"
        run: node scripts/test_gameplay_v57.mjs
      - name: "V55: Harder fundamentals, real XP/FP, background sync and level progression"
        run: node scripts/test_foundations_levels_v55.mjs
      - name: "V54: Real iPhone audio unlock, self-dismissed frameless rewards"
        run: node scripts/test_reward_sound_v54.mjs
      - name: "V53: Earned award reveals, accessibility and server-backed achievements"
        run: node scripts/test_celebrations_v53.mjs
      - name: "V52: Lightweight audio and motion preferences with verified result feedback"
        run: node scripts/test_feedback_v52.mjs
      - name: "V51: Daily quizzes, skill reviews, weekly case and server sync"
        run: node scripts/test_missions_v51.mjs
      - name: "V50: real earned analyst toolbox, calculations, security and account isolation"
        run: node scripts/test_toolbox_v50.mjs
      - name: Check financial calculations and unlocks
        run: node scripts/test_career.mjs
      - name: Check economy idempotency and rewards
        run: node scripts/test_economy.mjs
      - name: Check navigation and automatic PWA upgrades
        run: node scripts/test_navigation_v15.mjs
      - name: Verify mobile safe-area and authenticated sync lifecycle
        run: node scripts/test_mobile_v19.mjs
      - name: Check expanded skill-world and financial concepts curriculum
        run: node scripts/test_learning_v16.mjs
      - name: Validate financial transfer cases, critical questions and skill prerequisites
        run: node scripts/test_transfer_v20.mjs
      - name: Audit guided KION and Microsoft investment-committee analysis
        run: node scripts/test_investment_committee_v21.mjs
      - name: Validate full 20-stage sourced Alphabet masterclass and research gating
        run: node scripts/test_equity_masterclass_v22.mjs
      - name: Test private thesis journal, scenario feedback, timeline and account merge
        run: node scripts/test_theses_v23.mjs
      - name: Verify daily private review queue, opt-in consent, feedback history and task freshness
        run: node scripts/test_daily_review_v25.mjs
      - name: Validate EUR 1,000 budget, fractional orders, authenticated daily streak and no double rewards
        run: node scripts/test_portfolio_v26.mjs
      - name: Validate international stock search and private watchlist
        run: node scripts/test_global_stock_v27.mjs
      - name: Test stable GuV lesson, no-reload sync, artifact capital and company news navigation
        run: node scripts/test_learning_watch_v28.mjs
      - name: "Regression: GuV course completion, cloud sync and editorial watchlist"
        run: node scripts/test_course_sync_v31.mjs
      - name: "Regression: Watchlist charts, news desks and daily learning newsroom"
        run: node scripts/test_market_learning_v34.mjs
      - name: "Regression: Interactive chart ranges, BayWa alternative exchange and issue inbox"
        run: node scripts/test_charts_issues_v35.mjs
      - name: "Regression: Verified stock search and complete editorial readers"
        run: node scripts/test_news_reader_v36.mjs
      - name: "Regression: Guided learning progression, safe course review, editorial free reading and stock prices"
        run: node scripts/test_learning_flow_v37.mjs
      - name: "Regression: Private Watchlist event inbox and submitted free-text reviews"
        run: node scripts/test_editorial_queue_v38.mjs
      - name: "Regression: Concise 18-part Grundlagen path with preserved 36 source lessons"
        run: node scripts/test_journey_v39.mjs
      - name: "Regression: Verified EUR fractional trading and 30-day streak milestones"
        run: node scripts/test_portfolio_streak_v40.mjs
      - name: "Regression: Four-list Lernen and verified skill rewards"
        run: node scripts/test_specialization_v41.mjs
      - name: "Regression: Four-row Lernen, true zoomable Skillbaum, lean foundations, direct Profil and no duplicate Depot chart"
        run: node scripts/test_learning_redesign_v42.mjs
      - name: Validate v45 watchlist financial statements, 8 branches, cross-skills and navigation
        run: node scripts/test_market_financials_skills_v45.mjs
      - name: "v47: Verify all four company dossiers, 100+ sourced KPIs, honest gaps, period-safe tables and watchlist controls"
        run: node scripts/test_comprehensive_financials_v47.mjs
      - name: "v48: Start homepage, clickable full editorial articles, learner actions and enriched exercises"
        run: node scripts/test_home_reader_v48.mjs
      - name: "v46: Audit all 36 fundamentals, all 132 specialist lessons, learning stages and reward-free spaced practice"
        run: node scripts/test_study_depth_v46.mjs
      - name: "v49: Verify eight new skill pathways, client/server answers and teaching quality"
        run: node scripts/test_skill_expansion_v49.mjs
      - name: "Regression: 3-skill promotions, artifact shards, 28 skills, free news and reset safety"
        run: node scripts/test_progression_news_v44.mjs
