<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c1522"><meta name="description" content="Dein täglicher, kostenloser Finanz-Lerncoach – verständlich und unabhängig.">
  <title>FinanzPilot · Dein täglicher Finanzcoach</title>
  <link rel="stylesheet" href="styles.css"><link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-symbol">↗</div><div><b>FinanzPilot</b><small>Wissen. Märkte. Wachstum.</small></div></div>
      <nav id="side-nav" aria-label="Hauptnavigation">
        <button class="nav-item active" data-view="home"><span>◫</span> Heute</button>
        <button class="nav-item" data-view="learn"><span>✧</span> Lernen</button>
        <button class="nav-item" data-view="markets"><span>⌁</span> Märkte</button>
        <button class="nav-item" data-view="progress"><span>◉</span> Fortschritt</button>
      </nav>
      <div class="sidebar-bottom"><div class="small-heading">DEIN WISSEN WÄCHST</div><div class="side-level" id="side-level">Level 1 · Einsteiger</div><div class="progress-line"><span id="side-progress"></span></div><small id="side-xp">0 / 100 XP bis Level 2</small><div class="privacy-tag">◈ Privater Lernstand auf deinem Gerät</div></div>
    </aside>
    <div class="main-area">
      <header class="topbar"><div class="mobile-logo">↗ <b>FinanzPilot</b></div><div class="topbar-note">DEIN FINANZTRAINING</div><div class="header-right"><span class="pill muted" id="today-date"></span><span class="pill streak">◈ <b id="top-streak">0</b> Tage</span></div></header>
      <main id="view-root" aria-live="polite"></main>
      <footer class="site-footer">Finanzbildung, keine Anlageberatung · Quellen prüfen · Keine Käufe aus einer einzelnen Nachricht ableiten</footer>
    </div>
    <nav class="bottom-nav" aria-label="Mobilnavigation"><button data-view="home" class="active">⌂<small>Heute</small></button><button data-view="learn">✧<small>Lernen</small></button><button data-view="markets">⌁<small>Märkte</small></button><button data-view="progress">◉<small>Fortschritt</small></button></nav>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
